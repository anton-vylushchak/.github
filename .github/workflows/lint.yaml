name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (default ubuntu-slim).
        type: string
        required: false
      timeout-minutes:
        description: Job timeout in minutes (default 5). ubuntu-slim stops jobs at 15.
        type: number
        required: false

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ inputs.runs-on || 'ubuntu-slim' }}
    timeout-minutes: ${{ inputs.timeout-minutes || 5 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version-file: uv.lock
          cache-python: true

      # uv.lock pins the tools that build the hooks and, through uv, the Python version.
      # The key includes it because a cache restored by an exact match isn't saved again.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
          restore-keys: pre-commit-${{ runner.os }}-${{ runner.arch }}-

      - name: Run pre-commit
        id: pre-commit
        run: |
          set +e -o pipefail
          uv run --locked pre-commit run \
            --all-files \
            --hook-stage manual \
            | tee "$RUNNER_TEMP/pre-commit.log"
          status=$?
          git diff | tee "$RUNNER_TEMP/changes.diff"
          exit "$status"

      - name: Write failure summary
        if: failure() && steps.pre-commit.outcome == 'failure'
        run: |
          {
            echo '~~~'
            sed '/^\[INFO\] /d' "$RUNNER_TEMP/pre-commit.log"
            echo '~~~'
            if [ -s "$RUNNER_TEMP/changes.diff" ]; then
              echo '~~~diff'
              cat "$RUNNER_TEMP/changes.diff"
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune pre-commit cache
        run: |
          uv run --locked pre-commit gc
          # Each Go hook runs its built binary, so drop the 270 MB Go toolchain pre-commit keeps next to it.
          rm -rf ~/.cache/pre-commit/*/golangenv-*/.go
