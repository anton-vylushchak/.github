name: Release

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (default ubuntu-slim).
        type: string
        required: false
      timeout-minutes:
        description: Job timeout in minutes (default 3). ubuntu-slim stops jobs at 15.
        type: number
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ inputs.runs-on || 'ubuntu-slim' }}
    timeout-minutes: ${{ inputs.timeout-minutes || 3 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: uv.lock
          cache-python: true

      - name: Get next version
        id: version
        run: |
          # git-cliff writes no notes when no commit since the last tag warrants a release.
          notes=$(uv run --locked git-cliff --unreleased --strip all)
          if [ -n "$notes" ]; then
            notes_file="$RUNNER_TEMP/notes.md"
            printf '%s' "$notes" > "$notes_file"
            tag=$(uv run --locked git-cliff --unreleased --bumped-version)
            {
              echo "tag=$tag"
              echo "notes-file=$notes_file"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No release: nothing since the last tag calls for a new version." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.version.outputs.notes-file }}
        run: |
          # Release notes in private and internal repos don't link #N, so link pull requests explicitly.
          sed -i -E "s|\(#([0-9]+)\)|([#\1]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/\1))|g" "$NOTES_FILE"
          url=$(gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE")
          echo "$url"
          {
            echo "## Released [$TAG]($url)"
            echo
            cat "$NOTES_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
