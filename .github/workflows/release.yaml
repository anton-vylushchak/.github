name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Get next version
        id: version
        run: |
          # git-cliff writes no notes when no commit since the last tag warrants a release.
          notes=$(uv run --locked git-cliff --unreleased --strip all)
          if [ -n "$notes" ]; then
            notes_file="$RUNNER_TEMP/notes.md"
            printf '%s' "$notes" > "$notes_file"
            tag=$(uv run --locked git-cliff --bumped-version)
            {
              echo "tag=$tag"
              echo "notes-file=$notes_file"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.version.outputs.notes-file }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE"
