version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/workflow-templates"]
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: America/Toronto
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: America/Toronto
    commit-message:
      prefix: ci
      include: scope
    groups:
      hooks:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: America/Toronto
    commit-message:
      prefix: chore
      include: scope
    groups:
      packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]
