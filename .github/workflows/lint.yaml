name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      runs-on:
        description: Runner label (default ubuntu-slim).
        type: string
        required: false
      timeout-minutes:
        description: Job timeout in minutes (default 5). ubuntu-slim stops jobs at 15.
        type: number
        required: false

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ inputs.runs-on || 'ubuntu-slim' }}
    timeout-minutes: ${{ inputs.timeout-minutes || 5 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-python: true

      # pre-commit builds Python hooks with the project's Python, so a new patch version needs a new cache.
      - name: Get cache key
        id: cache-key
        run: |
          uv sync --locked
          python_version=$(uv python find --show-version)
          base="pre-commit-$RUNNER_OS-$RUNNER_ARCH"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prefix=$base-py$python_version" >> "$GITHUB_OUTPUT"

      # The key includes uv.lock, which pins the tools that build the hooks, since an exact match isn't saved again.
      # The second restore key reuses the hooks that don't depend on Python after a Python update.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ steps.cache-key.outputs.prefix }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}-
            ${{ steps.cache-key.outputs.base }}-

      - name: Run pre-commit
        id: pre-commit
        run: |
          set +e -o pipefail
          uv run --locked pre-commit run \
            --all-files \
            --hook-stage manual | tee "$RUNNER_TEMP/pre-commit.log"
          status=$?
          git diff | tee "$RUNNER_TEMP/changes.diff"
          exit "$status"

      - name: Write failure summary
        if: failure() && steps.pre-commit.outcome == 'failure'
        run: |
          {
            echo '~~~'
            sed '/^\[INFO\] /d' "$RUNNER_TEMP/pre-commit.log"
            echo '~~~'
            if [ -s "$RUNNER_TEMP/changes.diff" ]; then
              echo '~~~diff'
              cat "$RUNNER_TEMP/changes.diff"
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prune pre-commit cache
        run: uv run --locked pre-commit gc
